version: "3.9"

services:
    postgres:
        image: postgres:16
        container_name: CF-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password
            POSTGRES_DB: cf-db
        ports:
            - "5432:5432"
        volumes:
            - CF_postgres_data:/var/lib/postgresql/data

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: CF-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: password
        ports:
            - "5050:80"
        depends_on:
            - postgres
        volumes:
            - CF_pgadmin_data:/var/lib/pgadmin

volumes:
    CF_postgres_data:
    CF_pgadmin_data:
