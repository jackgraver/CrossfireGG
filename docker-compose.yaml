services:
    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                VITE_API_BASE_URL: ${SERVICE_URL_BACKEND}
        environment:
            SERVICE_URL_FRONTEND_5173: ""
            NODE_ENV: production
            PORT: "5173"
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        environment:
            SERVICE_URL_BACKEND_8080: ""
            NODE_ENV: production
            PORT: "8080"
            DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cf_db}
            CORS_ALLOWED_ORIGINS: ${SERVICE_URL_FRONTEND}
            FACEIT_CLIENT_ID: ${FACEIT_CLIENT_ID}
            FACEIT_CLIENT_SECRET: ${FACEIT_CLIENT_SECRET}
            FACEIT_API_KEY: ${FACEIT_API_KEY}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cf_db}
            POSTGRES_USER: ${POSTGRES_USER:-app_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-cf_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
