services:
    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
        ports:
            - "5173:5173"
        environment:
            NODE_ENV: production
            PORT: 5173
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - public
        restart: unless-stopped

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        ports:
            - "8080:8080"
        env_file:
            - ./backend/.env
        environment:
            NODE_ENV: production
            PORT: 8080
            DATABASE_URL: postgresql://app_user:app_password@postgres:5432/cf-db
            CORS_ALLOWED_ORIGINS: http://localhost:5173
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - public
            - private
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: cf-db
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app_user -d cf-db"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:

networks:
    public:
    private:
        internal: true
