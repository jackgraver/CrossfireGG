services:
    frontend:
        image: registry.digitalocean.com/crossfire-buildimages/cf-frontend:latest
        environment:
            NODE_ENV: production
            PORT: "3000"
            SERVER_API_BASE_URL: http://backend:5000
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped
        expose:
            - "3000"

    backend:
        image: registry.digitalocean.com/crossfire-buildimages/cf-backend:latest
        environment:
            NODE_ENV: production
            PORT: "5000"
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            APP_ORIGIN: ${APP_ORIGIN}
            AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS}
            FACEIT_REDIRECT_URI: ${FACEIT_REDIRECT_URI}
            FACEIT_CLIENT_ID: ${FACEIT_CLIENT_ID}
            FACEIT_CLIENT_SECRET: ${FACEIT_CLIENT_SECRET}
            FACEIT_API_KEY: ${FACEIT_API_KEY}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
        expose:
            - "5000"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        expose:
            - "6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cf-db}
            POSTGRES_USER: ${POSTGRES_USER:-app-user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defpass}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app-user} -d ${POSTGRES_DB:-cf-db}"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    redis_data:
