services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - frontend
            - backend

    frontend:
        image: registry.digitalocean.com/crossfire-buildimages/cf-frontend:latest
        environment:
            NODE_ENV: production
            PORT: "3000"
        restart: unless-stopped

    backend:
        image: registry.digitalocean.com/crossfire-buildimages/cf-backend:latest
        environment:
            NODE_ENV: production
            PORT: "5000"
            DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cf_db}
            CORS_ALLOWED_ORIGINS: ${APP_ORIGIN}
            APP_ORIGIN: ${APP_ORIGIN}
            AUTH_TRUSTED_ORIGINS: ${APP_ORIGIN}
            FACEIT_REDIRECT_URI: ${APP_ORIGIN}/api/auth/callback/faceit
            FACEIT_CLIENT_ID: ${FACEIT_CLIENT_ID}
            FACEIT_CLIENT_SECRET: ${FACEIT_CLIENT_SECRET}
            FACEIT_API_KEY: ${FACEIT_API_KEY}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cf_db}
            POSTGRES_USER: ${POSTGRES_USER:-app_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-cf_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    caddy_data:
    caddy_config:
