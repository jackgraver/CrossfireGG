services:
    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://backend:8080}"
        environment:
            NODE_ENV: production
            PORT: 5173
        networks:
            - public
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        env_file:
            - ./backend/.env
        environment:
            NODE_ENV: production
            PORT: 8080
            DATABASE_URL: postgresql://app_user:app_password@postgres:5432/cf-db
            CORS_ALLOWED_ORIGINS: http://frontend:5173
        networks:
            - public
            - private
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: cf-db
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private

volumes:
    postgres_data:

networks:
    public:
    private:
        internal: true
