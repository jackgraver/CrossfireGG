name: Build and Push Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/${OWNER_LC}/cf-frontend:latest \
            --build-arg VITE_API_BASE_URL=https://api.crossfiregg.com \
            -f frontend/Dockerfile .

      - name: Push frontend
        run: |
          docker push ghcr.io/${OWNER_LC}/cf-frontend:latest

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/${OWNER_LC}/cf-backend:latest \
            -f backend/Dockerfile .

      - name: Push backend
        run: |
          docker push ghcr.io/${OWNER_LC}/cf-backend:latest
